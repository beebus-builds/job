services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - aj-data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
      - NEXT_PUBLIC_SITE_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  aj-data:
